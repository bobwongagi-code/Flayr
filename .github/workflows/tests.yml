name: Flayr tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check --requirement requirements-dev.lock
      - run: python -m pip check
      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install ffmpeg --no-progress -y
      - name: Tests
        shell: bash
        env:
          FLAYR_COVERAGE: "1"
          FLAYR_SCOPE_SPEC: references/bitter-lesson-runtime-fix-scope.json
          FLAYR_SCOPE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        run: bash scripts/run-tests.sh
      - name: Quality gates
        shell: bash
        run: bash scripts/run-quality-gates.sh
